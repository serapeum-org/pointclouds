[project]
name = "pointclouds"
version = "0.1.0"
description = "Point cloud (LAS/LAZ/COPC) I/O, filtering, decimation and gridding"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["point cloud", "pointcloud", "lidar", "LAS", "LAZ", "COPC", "GIS"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# The GDAL-free core. Every runtime dependency here is a pure-PyPI wheel that
# installs anywhere numpy runs - no conda channel, no osgeo, no pyramids. That
# is the scope boundary from ADR-0001, and `tests/test_core_has_no_gdal.py`
# enforces it: adding a dependency that drags GDAL in belongs in the `gis`
# extra below, never in this list.
dependencies = [
    "numpy >=2.0.0",
    # laspy is the LAS/LAZ reader; the `lazrs` extra is what makes compressed
    # LAZ readable at all (laspy ships no compressor of its own).
    "laspy[lazrs] >=2.5",
    "pyproj >=3.7",
    "scipy >=1.10",
]

[project.optional-dependencies]
# One extra per dependency-backed capability. A module whose extra is absent
# must fail with a guarded import that names the extra, so a bare install stays
# small and every other code path keeps working.
#
# The bridge to the GIS engine. Only `src/pointclouds/convert.py` may import
# pyramids, and only inside a function - the `pyramids-gis` wheel vendors its
# own osgeo bindings, and `import pyramids` is what puts them on `sys.path`.
# Nothing here installs or pins a separate GDAL.
gis = ["pyramids-gis >=0.63.0"]

# Remote LAZ / COPC over HTTP and object storage.
cloud = ["fsspec >=2024.1", "s3fs"]

all = ["pointclouds[gis,cloud]"]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "nbstripout >=0.7.1",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >=5.0.0",
    "pytest-env >=1.6.0",
    "pytest-mock >=3.12.0",
    "pytest-xdist >=3.6.1",
    "coverage",
    "build >=1.0.0",
    "twine >=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen >=4.8.4",
    "mypy >=1.10.0",
    "types-PyYAML >=6.0.0",
    # Pinned, not floored: this is the same version the `.pre-commit-config.yaml`
    # hook pins, so `uv run ruff check` locally, the hook, and the lint workflow
    # all enforce one rule set. Keep the two revs in step. ruff covers what the
    # pixi repos in this org split across black, flake8 and pydocstyle.
    "ruff ==0.15.22",
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs >=1.2",
    "mkdocs-macros-plugin >=1.3.7",
    "mkdocs-table-reader-plugin >=3.1.0",
    "mkdocs-mermaid2-plugin >=1.2.1",
    "mkdocs-panzoom-plugin",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]

[project.urls]
homepage = "https://github.com/serapeum-org/pointclouds"
repository = "https://github.com/serapeum-org/pointclouds"
documentation = "https://serapeum-org.github.io/pointclouds"
Changelog = "https://github.com/serapeum-org/pointclouds/blob/main/docs/change-log.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pointclouds"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
changelog_incremental = true
update_changelog_on_bump = true
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "gis: needs the [gis] extra (pyramids-gis) - deselect with '-m \"not gis\"'",
    "cloud: needs the [cloud] extra (fsspec/s3fs)",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pixi.workspace]
channels = ["conda-forge"]
# The macOS baseline is raised on osx-arm64 so pixi picks the pre-built wheels
# instead of falling back to sdists. pyproj publishes only `macosx_14_0_arm64`
# for arm64, above the pixi default, so without this it has no wheel to take and
# builds from source - which needs PROJ headers the runner does not have. numpy
# and scipy also ship a `macosx_14_0_arm64` build and quietly drop to an older,
# lower-baseline wheel without it. macos-latest runners are >= 14.
#
# Declared here rather than in a `[tool.pixi.system-requirements]` table: pixi
# 0.73 deprecates that table in favour of virtual packages on the platform entry.
platforms = ["win-64", "linux-64", { platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.pypi-dependencies]
pointclouds = { path = ".", editable = true }
# The editable self-install is the only entry, and there is no
# [tool.pixi.dependencies] table beyond the interpreter pins below: every
# environment is built from the standard declarations - runtime deps from
# [project.dependencies], tooling from the `dev` / `docs` dependency groups, the
# optional stacks from [project.optional-dependencies] - all resolved from PyPI.
#
# In particular there is no conda `gdal`, and there must never be one. The core
# is GDAL-free by design (ADR-0001); the `gis` feature's pyramids-gis wheel
# vendors its own osgeo and `import pyramids` prepends that directory to
# `sys.path`, so a conda GDAL would be installed and never imported.

[tool.pixi.tasks]
# `main` is the core suite: the GDAL-free install, with the extras deselected by
# marker. It runs in every pyXXX environment, none of which carries `gis` or
# `cloud`, so an accidental import of pyramids fails the run rather than passing
# quietly on a machine that happens to have it.
main = { cmd = "pytest -vvv --cov=src/pointclouds -sv -m 'not gis and not cloud' --cov-report=xml", description = "Run the core test suite (no extras)" }
test-all = { cmd = "pytest -vvv --cov=src/pointclouds -sv --cov-report=xml --cov-report=term-missing", description = "Run the whole test suite (needs the `full` environment)" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks" }
doctest = { cmd = "pytest --doctest-modules src/pointclouds -p no:cacheprovider", description = "Run the src doctests" }
typecheck = { cmd = "mypy src/pointclouds", description = "Type check the package" }
sample-data = { cmd = "python examples/data/make_sample.py", description = "Regenerate the committed LAS/LAZ fixtures" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate the changelog with commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump the version with commitizen" }

[tool.pixi.environments]
default = { features = ["py314"], solve-group = "default" }
dev = { features = ["py314", "dev"], solve-group = "default" }
docs = { features = ["py314", "docs"], solve-group = "default" }
notebook = { features = ["py314", "notebook"], solve-group = "default" }
# The one environment that carries the optional stacks, and the only place
# `pytest -m gis` can pass. Kept on 3.12: pyramids-gis publishes cp311-cp314
# wheels, and 3.12 is the version its own CI exercises most.
full = { features = ["py312", "dev", "gis", "cloud"], solve-group = "py312" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }
py314 = { features = ["py314", "dev"], solve-group = "py314" }

# Interpreter pins, one feature per environment in the matrix. `default`, `dev`,
# `docs` and `notebook` reuse `py314` rather than declaring a second 3.14 pin of
# their own. Nothing else constrains them - without a pin their only bound is
# `requires-python = ">= 3.11, <4"`, so they would float to whatever conda-forge
# ships newest, and a release the dependencies have no wheels for yet would be
# resolved from sdists.
#
# 3.13 and 3.14 additionally carry a build glob to exclude the free-threaded
# interpreter, whose conda build string ends `_cp313t` / `_cp314t` - the glob
# anchors on the plain suffix, so it matches one and not the other. laspy's
# lazrs backend and scipy ship no free-threaded wheels, and nothing absorbs
# that: `pixi lock` and `pixi install` both still succeed in that state, so the
# failure lands at import rather than at resolve time.
#
# 3.11 and 3.12 need no glob - free-threading starts at 3.13, so conda-forge
# publishes no `t` variant to exclude.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = { version = "3.13.*", build = "*_cp313" }
[tool.pixi.feature.py314.dependencies]
python = { version = "3.14.*", build = "*_cp314" }
