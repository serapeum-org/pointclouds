# Gitleaks configuration for the CI secret scan (`gitleaks dir` in
# .github/workflows/lint.yml, which passes it as `-c .github/gitleaks.toml`). gitleaks is the repo's single secret scanner,
# matching pyramids, pyramids-eo and pyramids-mesh. There is no local gitleaks
# pre-commit hook here, so this file is read only by that job. It keeps
# gitleaks' full built-in ruleset and only allowlists paths that are registries
# or fixtures rather than source secrets.
title = "pointclouds"

[extend]
useDefault = true

[allowlist]
description = "Non-source paths: working notes and lockfile hashes"
paths = [
  # Planning / review notes are working documents, not shipped code.
  '''(^|/)planning/''',
  # PR review artifacts written into the repo root are working documents.
  '''pr-diff-review-.*\.md$''',
  # The dependency lockfile is package hashes, not credentials.
  '''pixi\.lock$''',
]
