name: github-release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: "Branch to create release from"
        required: false
        default: "main"
      increment:
        description: "Version increment type"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      prerelease_type:
        description: "Prerelease type"
        required: false
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
        default: "none"
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

jobs:
  # Build the pure wheel and run it across the OS/Python matrix (and the gis /
  # cloud extras) BEFORE cutting anything. The release job needs it, so a wheel
  # that cannot install or import on a supported target blocks the
  # tag/release/PyPI chain instead of shipping. Mirrors pyramids-mesh.
  pure-wheel-test:
    uses: ./.github/workflows/pure-wheel-test.yml
    with:
      branch: ${{ inputs.release-branch }}

  release:
    needs: pure-wheel-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release-branch }}

      - name: Check actor is a repository admin
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          echo "Permission level for ${{ github.actor }}: $PERMISSION"
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::${{ github.actor }} is not a repository admin. Only admins can trigger releases."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with Commitizen
        # serapeum-org/github-actions is a monorepo: one commit carries the release tag for
        # every action in it, so 38c11108 is the dereferenced commit for mkdocs/v1.3.1,
        # github-release/v1.5.0, pypi-release/v1.0.3 and pixi/v1.2.1 alike. Four different
        # actions pinned to one SHA reads like a copy-paste error and is not; verify with
        #   git ls-remote --tags https://github.com/serapeum-org/github-actions
        uses: serapeum-org/github-actions/actions/release/github@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # github-release/v1.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          increment: ${{ github.event.inputs.increment }}
          prerelease-type: ${{ github.event.inputs.prerelease_type }}
          draft: ${{ github.event.inputs.draft }}
          package-manager: pixi
          # Must match the pixi pinned in tests.yml: this job runs `pixi lock`
          # and commits the result, so a floating version could write a
          # lock-file format the test matrix cannot read.
          package-manager-version: v0.73.0
          install-groups: "dev"

      - name: Update lockfile after version bump
        run: pixi lock

      - name: Commit and push updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pixi.lock
          git diff --cached --quiet && echo "No lockfile changes" && exit 0
          git commit -m "build: sync pixi.lock after version bump"
          git push origin ${{ inputs.release-branch }}
