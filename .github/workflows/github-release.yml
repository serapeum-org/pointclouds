name: github-release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: "Branch to create release from"
        required: false
        default: "main"
      increment:
        description: "Version increment type"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      prerelease_type:
        description: "Prerelease type"
        required: false
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
        default: "none"
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release-branch }}

      - name: Check actor is a repository admin
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          echo "Permission level for ${{ github.actor }}: $PERMISSION"
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::${{ github.actor }} is not a repository admin. Only admins can trigger releases."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with Commitizen
        # serapeum-org/github-actions is a monorepo: one commit carries the release tag
        # for every action in it, so 38c11108 is the dereferenced commit for pixi/v1.2.1,
        # mkdocs/v1.3.1, github-release/v1.5.0 and pypi-release/v1.0.3 alike. Several
        # different actions pinned to one SHA reads like a copy-paste error and is not;
        # verify with
        #   git ls-remote --tags https://github.com/serapeum-org/github-actions
        uses: serapeum-org/github-actions/actions/release/github@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # github-release/v1.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          increment: ${{ github.event.inputs.increment }}
          prerelease-type: ${{ github.event.inputs.prerelease_type }}
          draft: ${{ github.event.inputs.draft }}
          package-manager: pixi
          # Must match the pixi pinned in tests.yml and lint.yml: this job
          # installs from pixi.lock, which is format v7 and unreadable to older
          # pixi.
          package-manager-version: v0.73.0
          install-groups: "dev"

      # There is deliberately no `pixi lock` + commit step here, unlike the uv
      # setup this replaced. uv.lock recorded the project's own version, so a
      # `cz bump` genuinely invalidated it; pixi.lock does not record it:
      #
      #   $ grep -A2 '^- pypi: \./' pixi.lock
      #   - pypi: ./
      #     name: pointclouds
      #     requires_dist:            <- no `version:` field
      #   $ sed -i 's/^version = "0.1.0"/version = "0.2.0"/' pyproject.toml
      #   $ pixi lock --check
      #   Lock-file was already up-to-date
      #
      # So a `pixi lock` after the bump can never be committing the bump. It can
      # only commit an unrelated re-solve caused by upstream channel churn -
      # pushed straight to the release branch, unreviewed, by a bot, moments
      # after the tag. The lock is kept fresh by the normal PR flow instead,
      # where every job runs with `verify-lock` and fails on drift.
