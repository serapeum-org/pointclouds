# Build and publish the Python package to PyPI using the shared composite action.

name: pypi-release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch, or SHA to publish to PyPI (e.g. 0.1.0)"
        required: true
        type: string
  workflow_run:
    workflows: ['github-release']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Security: when triggered via `workflow_run`, require that the upstream
    # workflow ran from the base repository (not a fork) so a fork can never
    # reach a context holding `PYPI_PUBLISH`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_repository.fork == false)

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # On workflow_run, pin to the immutable SHA recorded on the
          # originating run, not the mutable `head_branch` label
          # (CWE-829: actions/untrusted-checkout).
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Build and publish to PyPI
        # serapeum-org/github-actions is a monorepo: one commit carries the release tag
        # for every action in it, so 38c11108 is the dereferenced commit for pixi/v1.2.1,
        # mkdocs/v1.3.1, github-release/v1.5.0 and pypi-release/v1.0.3 alike. Several
        # different actions pinned to one SHA reads like a copy-paste error and is not;
        # verify with
        #   git ls-remote --tags https://github.com/serapeum-org/github-actions
        uses: serapeum-org/github-actions/actions/release/pypi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pypi-release/v1.0.3
        with:
          pypi-username: __token__
          pypi-password: ${{ secrets.PYPI_PUBLISH }}
          package-manager: 'pixi'
          package-manager-version: 'v0.73.0'
          install-groups: 'dev'
          # The version bump that precedes this run rewrites pyproject.toml, so
          # the lock is one commit behind by design here.
          verify-lock: 'false'
